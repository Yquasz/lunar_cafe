
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aura Café</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@200;300;400&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #f5f0e8;
      --warm-white: #faf7f2;
      --gold: #b89a5a;
      --gold-light: #d4b87a;
      --espresso: #1a1208;
      --bark: #2e1f0e;
      --mist: #8c7d6a;
      --border: rgba(184,154,90,0.25);
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      background: var(--espresso);
      color: var(--cream);
      font-family: 'Jost', sans-serif;
      font-weight: 300;
      overflow-x: hidden;
    }

    /* ── NAV ── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 28px 60px;
      mix-blend-mode: normal;
      transition: background 0.5s, padding 0.4s;
    }
    nav.scrolled {
      background: rgba(26,18,8,0.92);
      backdrop-filter: blur(12px);
      padding: 18px 60px;
      border-bottom: 1px solid var(--border);
    }
    .nav-logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.5rem;
      font-weight: 400;
      letter-spacing: 6px;
      color: var(--gold);
      text-decoration: none;
    }
    .nav-links {
      display: flex;
      gap: 40px;
      list-style: none;
    }
